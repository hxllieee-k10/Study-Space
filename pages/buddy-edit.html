<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Edit Study Buddy</title>

<link rel="stylesheet" href="../style.css">

(function(){

const theme =
localStorage.getItem("theme");


if(theme === "dark"){

document.documentElement.classList.add("dark");

}

})();

</script>

</head>

<button onclick="openPlanner()">

        id="themeButton">

<div class="buddy-edit-page">



<h1>
Edit Your Study Buddy ˙𐃷˙
</h1>


<p class="quote">
Update your companion's details.
</p>






<!-- PREVIEW -->


<div class="edit-preview">


<img
id="editBuddyImage"
src="">



<h2 id="editBuddyAnimal">
Buddy
</h2>


</div>







<!-- NAME -->


<label>
Buddy Name
</label>


<input
id="editBuddyName"
type="text"
placeholder="Name">







<!-- ANIMAL -->


<label>
Buddy Avatar
</label>


<div class="edit-avatar-box">

<img
id="editBuddyImage"
src=""
>


<button
class="avatar-change-btn"
onclick="changeAvatar()">

Change Avatar

</button>


</div>







<!-- MBTI -->


<label>
MBTI
</label>


<select id="editMBTI">


<option value="INTJ">INTJ</option>
<option value="INTP">INTP</option>
<option value="ENTJ">ENTJ</option>
<option value="ENTP">ENTP</option>

<option value="INFJ">INFJ</option>
<option value="INFP">INFP</option>
<option value="ENFJ">ENFJ</option>
<option value="ENFP">ENFP</option>

<option value="ISTJ">ISTJ</option>
<option value="ISFJ">ISFJ</option>
<option value="ESTJ">ESTJ</option>
<option value="ESFJ">ESFJ</option>

<option value="ISTP">ISTP</option>
<option value="ISFP">ISFP</option>
<option value="ESTP">ESTP</option>
<option value="ESFP">ESFP</option>


</select>



<!-- PERSONALITY -->



<label>
Buddy Personality
</label>


<select id="editPersonality">


<option value="Caring">
Caring
</option>


<option value="Playful">
Playful
</option>


<option value="Strict">
Strict
</option>


<option value="Funny">
Funny
</option>


<option value="Motivational">
Motivational
</option>


<option value="Calm">
Calm
</option>


<option value="Protective">
Protective
</option>


<option value="Cheerful">
Cheerful
</option>


<option value="Flirty">
Flirty
</option>




</select>






<!-- PROFILE -->


<label>
Bio
</label>


<textarea
id="editBio"
placeholder="Tell something about your buddy...">
</textarea>





<label>
Birthday
</label>


<input
id="editBirthday"
type="date">





<label>
Age
</label>


<input
id="editAge"
type="number">






<label>
Hobbies
</label>


<input
id="editHobbies"
placeholder="Reading, music, drawing...">






<label>
Currently struggling with
</label>


<textarea
id="editStruggle"
placeholder="What challenges is your buddy facing?">
</textarea>








<label>
Dreams & Ambitions
</label>


<textarea
id="editDreams"
placeholder="What does your buddy dream of?">
</textarea>







<p id="editMessage"></p>





<button
class="main-button"
onclick="saveBuddyEdit()">

Save Changes

</button>




</div>







<script src="../js/storage.js"></script>

<script src="../js/buddies.js"></script>
<script src="../js/dashboard.js"></script>
<script src="../js/buddy-edit.js"></script>
<script src="../js/theme.js"></script>


</body>

</html>
